[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython", "numpy", "ziglang"]
build-backend = "setuptools.build_meta"

[project]
name = "riley-raster"
version = "2026.9.0"
description = "A Zig software rasteriser for DIC UQ."
authors = [
  { name = "scepticalrabbit (Lloyd Fletcher)", email = "thescepticalrabbit@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
  "netCDF4>=1.7.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "Pillow>=10.0.0",
  "pytest>=9.0.0",
]

[project.urls]
"Repository" = "https://github.com/Computer-Aided-Validation-Laboratory/riley-raster"

[dependency-groups]
dev = [
  "build",
  "twine",
  "ziglang",
  "cython",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riley = [
  "data/**/*",
]

[tool.setuptools.exclude-package-data]
riley = [
  "data/**/__pycache__/*",
  "data/**/.DS_Store",
]
